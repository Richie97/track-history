<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track Evolution — App Preview</title>
<!--
  The App Store app preview: 886×1920 portrait (every Face ID iPhone size),
  under 30 s, on the promo's seekable timeline. preview.js builds it;
  render-preview.mjs seeks it frame by frame. Open it with ?t=<seconds>
  through any static server rooted at the repo to look at a moment.
-->
<style>
  @font-face { font-family: "Geist"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_variable.ttf") format("truetype"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_mono_variable.ttf") format("truetype"); }
  :root {
    --bg: #0a0a0b; --card: #131316; --raised: #1a1a1e;
    --hair: rgba(255, 255, 255, 0.09); --strong: rgba(255, 255, 255, 0.16);
    --text-strong: #f6f6f7; --text-body: #d6d6d9; --muted: #97979e; --faint: #6c6c73;
    --lime: #c8f24e; --lime-contrast: #0c1400; --danger: #f2726b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; transition: none !important; animation: none !important; }
  html, body { width: 886px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Geist", sans-serif; color: var(--text-body); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 886px; height: 1920px; overflow: hidden; background: var(--bg); }
  .bg { position: absolute; inset: 0; }
  #bg-glow { background: radial-gradient(700px 520px at var(--gx, 70%) var(--gy, 8%), rgba(200, 242, 78, 0.12), transparent 70%); }
  #bg-grid {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 64px 64px; background-position: 27px 0;
    mask-image: radial-gradient(800px 600px at 50% 10%, #000 20%, transparent 85%);
  }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; }

  /* captions */
  .cap { position: absolute; left: 48px; right: 48px; top: 78px; height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  .cap .h { white-space: nowrap; font-size: 64px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.035em; line-height: 1.04; }
  .cap .h .w { display: inline-block; white-space: pre; }
  .accent { color: var(--lime); }
  .tag { display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 999px;
    font-size: 19px; font-weight: 700; letter-spacing: 0.12em; border: 2px solid var(--lime); color: var(--lime); }
  .tag.pro { background: var(--lime); color: var(--lime-contrast); }

  /* the phone screen: footage or a stand-in, laid out at 390 CSS px and scaled */
  #screen { position: absolute; left: 93px; top: 352px; width: 700px; height: 1521px; border-radius: 64px; overflow: hidden;
    background: var(--bg); border: 2px solid rgba(255,255,255,0.14);
    box-shadow: 0 40px 120px rgba(0,0,0,0.7), 0 0 0 10px #050506, 0 0 0 11.5px rgba(255,255,255,0.12); }
  .slot { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .slot > img.clip { position: absolute; left: 0; top: 0; width: 100%; }
  .css390 { position: absolute; left: 0; top: 0; width: 390px; height: 847px; transform-origin: 0 0; overflow: hidden; }
  .css390 img.cap390 { position: absolute; left: 0; top: 54px; width: 390px; transform-origin: 0 0; }
  .statusbar { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: var(--bg); z-index: 2;
    display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 40px; color: var(--text-strong); font-size: 16px; font-weight: 600; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .sb-icons i { width: 4px; height: 11px; border-radius: 1px; background: var(--text-strong); display: block; }
  .sb-icons i:first-child { height: 7px; }
  .sb-icons b { width: 24px; height: 11px; border-radius: 3px; border: 1.5px solid var(--text-strong); display: block; margin-left: 4px; background: var(--text-strong); }
  .island { position: absolute; top: 11px; left: 50%; width: 120px; height: 35px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 3; }
  .draft { position: absolute; right: 14px; bottom: 14px; z-index: 5; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(240,164,92,0.92);
    color: #1a0e00; font: 700 11px "Geist", sans-serif; letter-spacing: 0.1em; display: inline-flex; align-items: center; }
  .ring { position: absolute; border: 3px solid var(--lime); border-radius: 14px; box-shadow: 0 0 0 5px rgba(200,242,78,0.18), 0 0 30px rgba(200,242,78,0.35); z-index: 4; }

  /* the recorder, drawn for the draft (mirrors RecordingScreen.swift) */
  .rec { position: absolute; inset: 0; padding: 66px 18px 30px; display: flex; flex-direction: column; gap: 14px; }
  .rec .bar { display: flex; justify-content: space-between; align-items: center; color: var(--text-strong); font-size: 17px; font-weight: 600; }
  .rec .tecard { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: 18px 18px 20px; }
  .rec .eb { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .rec .hero { font-family: "Geist Mono", monospace; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .rec .stats { display: flex; gap: 16px; }
  .rec .stats div { display: flex; flex-direction: column; gap: 3px; }
  .rec .stats .v { font-family: "Geist Mono", monospace; font-size: 16px; color: var(--text-body); font-variant-numeric: tabular-nums; }
  .rec .stop { height: 54px; border-radius: 14px; background: rgba(242,114,107,0.14); border: 1px solid rgba(242,114,107,0.5); color: var(--danger); font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  /* end card */
  .wordmark { font-size: 76px; font-weight: 700; letter-spacing: -0.045em; color: var(--text-strong); white-space: nowrap; }
  .endline { font-size: 46px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.03em; line-height: 1.15; text-align: center; }
  .endline .w { display: inline-block; white-space: pre; }
  .fine { font-size: 22px; color: var(--faint); text-align: center; }
  #fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; z-index: 60; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" style="background: var(--bg)"></div>
  <div class="bg" id="bg-glow"></div>
  <div class="bg" id="bg-grid"></div>
  <div id="screen"></div>
  <div id="caps"></div>
  <div id="end" class="scene"></div>
  <div id="fade"></div>
</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
