<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track Evolution — App Store header</title>
<!--
  The App Store's universal creative asset: one 5244×2950 canvas the store
  crops to the product page header (21:9, 3840×1646) and the search results
  card (3:2, 3840×2560). Everything that has to survive both crops sits in
  the header's art safe area, centred; the rest is bleed. render-header.mjs
  screenshots it — open it with ?guides through any static server rooted at
  the repo to see the crops and the safe area drawn over it.
-->
<style>
  @font-face { font-family: "Geist"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_variable.ttf") format("truetype"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_mono_variable.ttf") format("truetype"); }
  :root {
    --bg: #0a0a0b; --card: #131316; --hair: rgba(255, 255, 255, 0.09); --strong: rgba(255, 255, 255, 0.16);
    --text-strong: #f6f6f7; --text-body: #d6d6d9; --muted: #97979e; --faint: #6c6c73;
    --lime: #c8f24e; --lime-contrast: #0c1400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 5244px; height: 2950px; overflow: hidden; background: var(--bg); }
  body { font-family: "Geist", sans-serif; color: var(--text-body); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 5244px; height: 2950px; overflow: hidden; background: var(--bg); }
  .layer { position: absolute; inset: 0; }
  #glow { background:
    radial-gradient(1700px 900px at 50% 58%, rgba(200, 242, 78, 0.11), transparent 70%),
    radial-gradient(2600px 1500px at 50% 50%, rgba(200, 242, 78, 0.035), transparent 75%); }
  #grid {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.03) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 2px, transparent 2px);
    background-size: 160px 160px; background-position: 22px 75px;
    mask-image: radial-gradient(2600px 1500px at 50% 50%, #000 25%, transparent 80%);
  }
  #vignette { background: radial-gradient(3400px 2000px at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%); }
  svg.layer { width: 5244px; height: 2950px; overflow: visible; }

  .abs { position: absolute; }
  .headline { font-size: 150px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.04em; line-height: 1.04; white-space: nowrap; }
  .accent { color: var(--lime); }
  /* ?guides */
  .guide { position: absolute; border: 6px dashed; pointer-events: none; }
  .guide span { position: absolute; left: 12px; top: 8px; font: 600 40px "Geist Mono", monospace; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="glow"></div>
  <div class="layer" id="grid"></div>
  <svg class="layer" id="art" viewBox="0 0 5244 2950"></svg>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="type"></div>
</div>
<script type="module">
import { deltaSeries } from "../../public/js/channel-graphs.js";

const W = 5244, H = 2950;
// The header's art safe area (Apple's template: 1097,493 → 2743,1154 on the
// 3840×1646 header) mapped onto this canvas, which the header crop takes
// whole-width and 2247 px tall from the middle.
const HEADER = { x: 0, y: (H - W * 9 / 21) / 2, w: W, h: W * 9 / 21 };
const k = W / 3840;
const SAFE = { x: 1097 * k, y: HEADER.y + 493 * k, w: (2743 - 1097) * k, h: (1154 - 493) * k };
const SEARCH = { x: (W - H * 1.5) / 2, y: 0, w: H * 1.5, h: H };

const data = await (await fetch("../out/data.json")).json();
await Promise.all(["700 150px Geist", "600 44px Geist", "500 44px \"Geist Mono\""].map((f) => document.fonts.load(f)));
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("art");
const mk = (tag, attrs, into = svg) => {
  const e = document.createElementNS(NS, tag);
  for (const [a, v] of Object.entries(attrs)) e.setAttribute(a, v);
  into.appendChild(e);
  return e;
};
const fmtLap = (ms) => `${Math.floor(ms / 60000)}:${((ms % 60000) / 1000).toFixed(3).padStart(6, "0")}`;

// --- the art: one driver's laps, visit after visit -----------------------------
// The best lap of a first visit, a later one and the personal best, as the
// app's delta chart draws them: time behind the personal best, accumulating
// along the lap (public/js/channel-graphs.js's own deltaSeries). The PB is the
// flat line, slower laps climb above it — so the gap that fans open across the
// canvas is the time the driver found. No circuit map and no name: it reads as
// "laps getting faster", not as a particular track, and the fan runs off both
// edges so every crop is full.
const laps = data.overlay.laps; // oldest first, PB last
const dStep = data.overlay.dStepM;
const COLOURS = ["#f49ac0", "#6ea8ff", "#c8f24e"]; // --chart-line-c, -b, --chart-line
const LABELS = ["First visit", "Next season", "Best"];
const pbLap = laps[laps.length - 1];
const deltas = laps.map((l) => deltaSeries({ speed: l.speed, timeMs: l.ms }, { speed: pbLap.speed, timeMs: pbLap.ms }, dStep));
// The lap runs from off the left edge to the right of the safe area, so the
// fan is widest — the whole time found — where every crop can see it.
const BAND = { y0: SAFE.y + SAFE.h * 0.5, y1: SAFE.y + SAFE.h - 50 };
const dMax = Math.max(...deltas.flat());
const X0 = -W * 0.02, X1 = SAFE.x + SAFE.w - 640;
{
  const defs = mk("defs", {});
  const f = mk("filter", { id: "glow", x: "-5%", y: "-50%", width: "110%", height: "200%" }, defs);
  mk("feGaussianBlur", { stdDeviation: "12", result: "b" }, f);
  const merge = mk("feMerge", {}, f);
  mk("feMergeNode", { in: "b" }, merge);
  mk("feMergeNode", { in: "SourceGraphic" }, merge);
  const fade = mk("linearGradient", { id: "edgefade", x1: "0", x2: "1", y1: "0", y2: "0" }, defs);
  for (const [o, a] of [[0, 0], [0.06, 1], [0.94, 1], [1, 0]]) mk("stop", { offset: o, "stop-color": "#fff", "stop-opacity": a }, fade);
  const mask = mk("mask", { id: "edges", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: W, height: H }, defs);
  mk("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#edgefade)" }, mask);
  const wash = mk("linearGradient", { id: "wash", x1: "0", x2: "0", y1: "0", y2: "1" }, defs);
  mk("stop", { offset: 0, "stop-color": "#c8f24e", "stop-opacity": 0.16 }, wash);
  mk("stop", { offset: 1, "stop-color": "#c8f24e", "stop-opacity": 0.02 }, wash);
  const g = mk("g", { mask: "url(#edges)" });
  const xOf = (j, n) => X0 + (X1 - X0) * (j / (n - 1));
  const yOf = (d) => BAND.y1 - (d / dMax) * (BAND.y1 - BAND.y0);
  const path = (ds) => ds.map((d, j) => `${j ? "L" : "M"}${xOf(j, ds.length).toFixed(1)},${yOf(d).toFixed(1)}`).join(" ");
  // the PB lap's speed trace, as texture across the whole canvas
  {
    const sp = pbLap.speed, n = sp.length;
    const [lo, hi] = [Math.min(...sp), Math.max(...sp)];
    const T0 = -W * 0.04, T1 = W * 1.04;
    const ty0 = SAFE.y + SAFE.h * 0.55, ty1 = SAFE.y + SAFE.h + 360;
    const d = sp.map((v, j) => `${j ? "L" : "M"}${(T0 + (T1 - T0) * j / (n - 1)).toFixed(1)},${(ty1 - (v - lo) / (hi - lo) * (ty1 - ty0)).toFixed(1)}`).join(" ");
    mk("path", { d, fill: "none", stroke: "rgba(200,242,78,0.13)", "stroke-width": 8, "stroke-linejoin": "round" }, g);
  }
  // the panel's distance gridlines, faint
  for (let i = 0; i <= 16; i++) {
    const x = X0 + (X1 - X0) * (i / 16);
    mk("line", { x1: x, y1: BAND.y0 - 80, x2: x, y2: BAND.y1 + 60, stroke: "rgba(255,255,255,0.05)", "stroke-width": 3 }, g);
  }
  // the time found: the wash between the first visit and the PB
  const first = deltas[0];
  mk("path", { d: `${path(first)} L${X1},${yOf(0)} L${X0},${yOf(0)} Z`, fill: "url(#wash)" }, g);
  deltas.forEach((ds, i) => {
    const best = i === deltas.length - 1;
    mk("path", { d: path(ds), fill: "none", stroke: COLOURS[i], "stroke-width": best ? 16 : 12, "stroke-linejoin": "round", "stroke-linecap": "round",
      filter: best ? "url(#glow)" : "" }, g);
    // where the lap ends: a dot and the gap to the PB
    const yEnd = yOf(ds[ds.length - 1]);
    mk("circle", { cx: X1, cy: yEnd, r: best ? 22 : 18, fill: COLOURS[i] });
    const t = mk("text", { x: X1 + 48, y: yEnd + 19, "font-family": "Geist", "font-size": 54, "font-weight": 500, fill: "#97979e" });
    t.textContent = LABELS[i] + " ";
    const v = mk("tspan", { fill: COLOURS[i], "font-family": "Geist Mono", "font-weight": 500 }, t);
    v.textContent = best ? fmtLap(ds.length && laps[i].ms) : `+${(ds[ds.length - 1]).toFixed(1)}s`;
  });
}

// --- the type: the brand's line, and what the three colours are --------------
{
  const type = document.getElementById("type");
  const block = document.createElement("div");
  block.className = "abs";
  Object.assign(block.style, { left: `${SAFE.x}px`, width: `${SAFE.w}px`, top: `${SAFE.y + 20}px`, textAlign: "center" });
  block.innerHTML = `
    <div class="headline">Your track days,<br><span class="accent">remembered lap by lap.</span></div>`;
  type.appendChild(block);
  const bottom = SAFE.y + 20 + block.offsetHeight;
  if (bottom > BAND.y0 - 20) console.warn(`type runs ${Math.round(bottom - BAND.y0 + 20)} px into the traces`);
  const widest = Math.max(...[...block.querySelectorAll(".headline")].map((e) => e.scrollWidth));
  if (widest > SAFE.w + 1) console.warn(`type is ${widest - Math.round(SAFE.w)} px wider than the safe area`);
}

if (new URLSearchParams(location.search).has("guides")) {
  const stage = document.getElementById("stage");
  const guide = (r, colour, label) => {
    const g = document.createElement("div");
    g.className = "guide";
    Object.assign(g.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px`, borderColor: colour, color: colour });
    g.innerHTML = `<span>${label}</span>`;
    stage.appendChild(g);
  };
  guide(HEADER, "#6ea8ff", "product page header · 21:9");
  guide(SEARCH, "#f49ac0", "search results · 3:2");
  guide(SAFE, "#f0a45c", "art safe area");
}
window.__crops = { header: HEADER, search: SEARCH, safe: SAFE };
window.__ready = true;
</script>
</body>
</html>
