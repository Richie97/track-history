<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track Evolution — App Store header</title>
<!--
  The App Store's universal creative asset: one 5244×2950 canvas the store
  crops to the product page header (21:9, 3840×1646) and the search results
  card (3:2, 3840×2560). Everything that has to survive both crops sits in
  the header's art safe area, centred; the rest is bleed. render-header.mjs
  screenshots it — open it with ?guides through any static server rooted at
  the repo to see the crops and the safe area drawn over it.
-->
<style>
  @font-face { font-family: "Geist"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_variable.ttf") format("truetype"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_mono_variable.ttf") format("truetype"); }
  :root {
    --bg: #0a0a0b; --card: #131316; --hair: rgba(255, 255, 255, 0.09); --strong: rgba(255, 255, 255, 0.16);
    --text-strong: #f6f6f7; --text-body: #d6d6d9; --muted: #97979e; --faint: #6c6c73;
    --lime: #c8f24e; --lime-contrast: #0c1400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 5244px; height: 2950px; overflow: hidden; background: var(--bg); }
  body { font-family: "Geist", sans-serif; color: var(--text-body); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 5244px; height: 2950px; overflow: hidden; background: var(--bg); }
  .layer { position: absolute; inset: 0; }
  #glow { background:
    radial-gradient(1500px 1000px at 63% 50%, rgba(200, 242, 78, 0.13), transparent 70%),
    radial-gradient(2600px 1500px at 50% 50%, rgba(200, 242, 78, 0.035), transparent 75%); }
  #grid {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.03) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 2px, transparent 2px);
    background-size: 160px 160px; background-position: 22px 75px;
    mask-image: radial-gradient(2600px 1500px at 50% 50%, #000 25%, transparent 80%);
  }
  #vignette { background: radial-gradient(3400px 2000px at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%); }
  svg.layer { width: 5244px; height: 2950px; overflow: visible; }

  .abs { position: absolute; }
  .eyebrow { font-size: 54px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); white-space: nowrap; }
  .timer { font-family: "Geist Mono", monospace; font-size: 210px; font-weight: 500; color: var(--lime); letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meta { font-size: 44px; font-weight: 600; letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; white-space: nowrap; }
  .pb { display: inline-flex; align-items: center; gap: 26px; height: 118px; padding: 0 54px; border-radius: 999px; background: var(--lime); color: var(--lime-contrast); font-size: 46px; font-weight: 700; letter-spacing: 0.12em; white-space: nowrap; }
  .delta { font-size: 58px; font-weight: 500; color: var(--text-body); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .delta b { color: var(--lime); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ?guides */
  .guide { position: absolute; border: 6px dashed; pointer-events: none; }
  .guide span { position: absolute; left: 12px; top: 8px; font: 600 40px "Geist Mono", monospace; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="glow"></div>
  <div class="layer" id="grid"></div>
  <svg class="layer" id="art" viewBox="0 0 5244 2950"></svg>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="type"></div>
</div>
<script type="module">
import { fmtMs } from "../../public/js/format.js";

const W = 5244, H = 2950;
// The header's art safe area (Apple's template: 1097,493 → 2743,1154 on the
// 3840×1646 header) mapped onto this canvas, which the header crop takes
// whole-width and 2247 px tall from the middle.
const HEADER = { x: 0, y: (H - W * 9 / 21) / 2, w: W, h: W * 9 / 21 };
const k = W / 3840;
const SAFE = { x: 1097 * k, y: HEADER.y + 493 * k, w: (2743 - 1097) * k, h: (1154 - 493) * k };
// The left share of the safe area is the type, the rest the circuit.
const TYPE_SHARE = 0.43;
const SEARCH = { x: (W - H * 1.5) / 2, y: 0, w: H * 1.5, h: H };

const data = await (await fetch("../out/data.json")).json();
await Promise.all(["600 54px Geist", "700 46px Geist", "500 232px \"Geist Mono\""].map((f) => document.fonts.load(f)));
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("art");
const mk = (tag, attrs, into = svg) => {
  const e = document.createElementNS(NS, tag);
  for (const [a, v] of Object.entries(attrs)) e.setAttribute(a, v);
  into.appendChild(e);
  return e;
};
const mix = (a, b, p) => Math.round(a + (b - a) * p);
const speedColour = (p, alpha = 1) => `rgba(${mix(0x3a, 0xc8, p)},${mix(0x42, 0xf2, p)},${mix(0x1f, 0x4e, p)},${alpha})`;

const tr = data.pb.trace; // [x, y, m/s], metres
const vs = tr.map((p) => p[2]);
const [vmin, vmax] = [Math.min(...vs), Math.max(...vs)];
// cumulative distance, for the speed trace
const dist = [0];
for (let i = 1; i < tr.length; i++) dist.push(dist[i - 1] + Math.hypot(tr[i][0] - tr[i - 1][0], tr[i][1] - tr[i - 1][1]));
const lapM = dist[dist.length - 1];

// --- bleed: the PB lap's speed trace, laid across the whole canvas -----------
// Three laps of it end to end, so the band runs off both edges whatever the
// crop; brighter is faster, as on the app's maps.
{
  const g = mk("g", { opacity: "0.55" });
  const band = { y0: 1475 - 520, y1: 1475 + 520 };
  const laps = 3;
  const pxPerM = W / (lapM * 2.15);
  const x0 = W / 2 - lapM * pxPerM * 1.5;
  const yOf = (v) => band.y1 - ((v - vmin) / (vmax - vmin)) * (band.y1 - band.y0);
  for (let L = 0; L < laps; L++) {
    for (let i = 0; i + 1 < tr.length; i++) {
      const xa = x0 + (L * lapM + dist[i]) * pxPerM, xb = x0 + (L * lapM + dist[i + 1]) * pxPerM;
      const p = (tr[i][2] - vmin) / (vmax - vmin);
      mk("line", { x1: xa, y1: yOf(tr[i][2]), x2: xb, y2: yOf(tr[i + 1][2]), stroke: speedColour(p, 0.55), "stroke-width": 7, "stroke-linecap": "round" }, g);
    }
    // the start/finish of each lap, as a hairline
    const xs = x0 + L * lapM * pxPerM;
    mk("line", { x1: xs, y1: band.y0 - 160, x2: xs, y2: band.y1 + 160, stroke: "rgba(255,255,255,0.10)", "stroke-width": 3, "stroke-dasharray": "14 18" }, g);
  }
  // the band fades out under the type and toward the edges
  const fade = mk("linearGradient", { id: "bandfade", x1: "0", x2: "1", y1: "0", y2: "0" }, mk("defs", {}));
  for (const [o, a] of [[0, 0.0], [0.12, 1], [0.3, 0.35], [0.5, 0.15], [0.7, 0.35], [0.88, 1], [1, 0]]) mk("stop", { offset: o, "stop-color": "#fff", "stop-opacity": a }, fade);
  const mask = mk("mask", { id: "bandmask", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: W, height: H }, svg.querySelector("defs"));
  mk("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#bandfade)" }, mask);
  g.setAttribute("mask", "url(#bandmask)");
}

// --- the racing line, in the right of the safe area ----------------------------
{
  const box = { x: SAFE.x + SAFE.w * TYPE_SHARE + 70, y: SAFE.y + 40, w: SAFE.w * (1 - TYPE_SHARE) - 110, h: SAFE.h - 80 };
  const xs = tr.map((p) => p[0]), ys = tr.map((p) => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const s = Math.min(box.w / (x1 - x0), box.h / (y1 - y0));
  const ox = box.x + (box.w - (x1 - x0) * s) / 2, oy = box.y + (box.h - (y1 - y0) * s) / 2;
  const pts = tr.map((p) => [ox + (p[0] - x0) * s, oy + (y1 - p[1]) * s, p[2]]);
  const poly = pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ") + ` ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const defs = svg.querySelector("defs");
  const f = mk("filter", { id: "glow", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
  mk("feGaussianBlur", { stdDeviation: "16", result: "b" }, f);
  const merge = mk("feMerge", {}, f);
  mk("feMergeNode", { in: "b" }, merge);
  mk("feMergeNode", { in: "SourceGraphic" }, merge);
  mk("polyline", { points: poly, fill: "none", stroke: "rgba(255,255,255,0.08)", "stroke-width": 48, "stroke-linejoin": "round", "stroke-linecap": "round" });
  const g = mk("g", { filter: "url(#glow)" });
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const p = (a[2] - vmin) / (vmax - vmin);
    mk("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: speedColour(p), "stroke-width": 17, "stroke-linecap": "round" }, g);
  }
  // the car, at the start/finish line
  const [hx, hy] = pts[0];
  mk("circle", { cx: hx, cy: hy, r: 58, fill: "rgba(200,242,78,0.22)" });
  mk("circle", { cx: hx, cy: hy, r: 22, fill: "#f6f6f7" });
}

// --- the lap, in the left of the safe area -------------------------------------
{
  const type = document.getElementById("type");
  const block = document.createElement("div");
  block.className = "abs";
  Object.assign(block.style, { left: `${SAFE.x + 20}px`, top: "0px" });
  const firstMs = data.progression[0].best_ms;
  block.innerHTML = `
    <div class="eyebrow">Circuit of the Americas</div>
    <div class="timer" style="margin-top:30px">${fmtMs(data.pb.ms)}</div>
    <div class="delta" style="margin-top:30px"><b>−${((firstMs - data.pb.ms) / 1000).toFixed(1)}s</b> <span style="color:var(--muted)">since the first visit</span></div>
    <div class="pb" style="margin-top:56px">★&nbsp;PERSONAL BEST</div>`;
  type.appendChild(block);
  // centred on the safe area, vertically
  block.style.top = `${SAFE.y + (SAFE.h - block.offsetHeight) / 2}px`;
  const right = SAFE.x + 20 + block.offsetWidth;
  if (right > SAFE.x + SAFE.w * TYPE_SHARE) console.warn(`type runs ${Math.round(right - SAFE.x - SAFE.w * TYPE_SHARE)} px into the circuit`);
}

if (new URLSearchParams(location.search).has("guides")) {
  const stage = document.getElementById("stage");
  const guide = (r, colour, label) => {
    const g = document.createElement("div");
    g.className = "guide";
    Object.assign(g.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px`, borderColor: colour, color: colour });
    g.innerHTML = `<span>${label}</span>`;
    stage.appendChild(g);
  };
  guide(HEADER, "#6ea8ff", "product page header · 21:9");
  guide(SEARCH, "#f49ac0", "search results · 3:2");
  guide(SAFE, "#f0a45c", "art safe area");
}
window.__crops = { header: HEADER, search: SEARCH, safe: SAFE };
window.__ready = true;
</script>
</body>
</html>
