<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track Evolution — promo</title>
<style>
  /* Geist from the copies the Android app bundles (SIL OFL 1.1). */
  @font-face { font-family: "Geist"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_variable.ttf") format("truetype"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: block;
    src: url("/apps/android/app/src/main/res/font/geist_mono_variable.ttf") format("truetype"); }

  /* The app's dark tokens (public/style.css). */
  :root {
    --bg: #0a0a0b; --bg-subtle: #0e0e10; --card: #131316; --raised: #1a1a1e;
    --hair: rgba(255, 255, 255, 0.09); --strong: rgba(255, 255, 255, 0.16);
    --text-strong: #f6f6f7; --text-body: #d6d6d9; --muted: #97979e; --faint: #6c6c73;
    --lime: #c8f24e; --lime-contrast: #0c1400; --lime-tint: rgba(200, 242, 78, 0.14);
    --blue: #6ea8ff; --pink: #f49ac0; --danger: #f2726b; --heat: #f0a45c;
    --map-slow: #3a421f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; transition: none !important; animation: none !important; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Geist", sans-serif; color: var(--text-body); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

  /* background */
  .bg { position: absolute; inset: 0; }
  #bg-glow { background: radial-gradient(900px 620px at var(--gx, 70%) var(--gy, 20%), rgba(200, 242, 78, 0.10), transparent 70%); }
  #bg-grid {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 96px 96px; background-position: -1px -1px;
    mask-image: radial-gradient(1300px 900px at 50% 45%, #000 30%, transparent 85%);
  }
  #bg-vignette { background: radial-gradient(1600px 1000px at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }

  .scene { position: absolute; inset: 0; }
  .abs { position: absolute; }

  /* type */
  .eyebrow { font-size: 21px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); }
  .headline { font-weight: 700; color: var(--text-strong); letter-spacing: -0.035em; line-height: 1.02; }
  .headline .w, .sub .w { display: inline-block; white-space: pre; }
  .accent { color: var(--lime); }
  .sub { font-size: 30px; line-height: 1.38; color: var(--muted); letter-spacing: -0.005em; }
  .sub b { color: var(--text-body); font-weight: 500; }
  .mono { font-family: "Geist Mono", monospace; }
  .tag {
    display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px;
    font-size: 16px; font-weight: 700; letter-spacing: 0.12em; border: 1.5px solid var(--lime); color: var(--lime);
  }
  .tag.pro { background: var(--lime); color: var(--lime-contrast); }
  .caption { display: flex; align-items: center; gap: 18px; }

  /* frames */
  .browser {
    position: absolute; border-radius: 16px; background: var(--card); overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 50px 120px rgba(0,0,0,0.65), 0 0 0 1px rgba(0,0,0,0.6);
  }
  .browser .chrome { height: 46px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: #101013; border-bottom: 1px solid var(--hair); }
  .browser .dots { display: flex; gap: 8px; }
  .browser .dots i { width: 12px; height: 12px; border-radius: 50%; background: #3a3a40; display: block; }
  .browser .url { flex: 1; max-width: 520px; margin: 0 auto; height: 28px; border-radius: 8px; background: #19191d; color: var(--muted);
    font-family: "Geist Mono", monospace; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .vp { position: relative; overflow: hidden; background: var(--bg); }
  .vp img, .crop img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
  .card-frame {
    position: absolute; border-radius: 18px; overflow: hidden; background: var(--card);
    border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 40px 110px rgba(0,0,0,0.6);
  }
  .crop { position: relative; overflow: hidden; width: 100%; height: 100%; }
  .phone {
    position: absolute; border-radius: 58px; background: #050506; padding: 12px;
    border: 1.5px solid rgba(255,255,255,0.16);
    box-shadow: 0 50px 120px rgba(0,0,0,0.7), inset 0 0 0 2px #1c1c20;
  }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: var(--bg); }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
  .phone .statusbar { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: var(--bg); z-index: 2;
    display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; color: var(--text-strong); font-size: 16px; font-weight: 600; }
  .phone .sb-icons { display: flex; align-items: center; gap: 6px; }
  .phone .sb-icons i { width: 4px; height: 11px; border-radius: 1px; background: var(--text-strong); display: block; }
  .phone .sb-icons i:first-child { height: 7px; }
  .phone .sb-icons b { width: 24px; height: 11px; border-radius: 3px; border: 1.5px solid var(--text-strong); display: block; margin-left: 4px; box-shadow: inset -7px 0 0 -1px var(--bg), inset 0 0 0 1.5px var(--bg); background: var(--text-strong); }
  .phone .island { position: absolute; top: 24px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #000; z-index: 3; }
  .ring { position: absolute; border: 3px solid var(--lime); border-radius: 12px; box-shadow: 0 0 0 6px rgba(200,242,78,0.18), 0 0 40px rgba(200,242,78,0.35); pointer-events: none; }
  .pill-label {
    position: absolute; height: 38px; padding: 0 16px; border-radius: 999px; background: rgba(19,19,22,0.92);
    border: 1px solid var(--strong); color: var(--text-strong); font-size: 18px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .pill-label .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); }

  /* cold open */
  #s0-timer { font-family: "Geist Mono", monospace; font-size: 150px; font-weight: 500; color: var(--text-strong); letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 17px; font-weight: 600; letter-spacing: 0.16em; color: var(--faint); text-transform: uppercase; }
  .stat-value { font-family: "Geist Mono", monospace; font-size: 44px; color: var(--text-body); font-variant-numeric: tabular-nums; }
  .pb-pill { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 26px; border-radius: 999px; background: var(--lime); color: var(--lime-contrast); font-size: 22px; font-weight: 700; letter-spacing: 0.12em; }

  /* brand */
  .wordmark { font-size: 120px; font-weight: 700; letter-spacing: -0.045em; color: var(--text-strong); white-space: nowrap; }

  /* chips (logbook hierarchy) */
  .hchip { display: inline-flex; align-items: center; height: 54px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--strong); background: var(--card); color: var(--text-strong); font-size: 23px; font-weight: 600; }
  .hsep { display: inline-block; color: var(--lime); font-size: 28px; font-weight: 700; margin: 0 10px; }

  /* import files */
  .file { display: flex; align-items: center; gap: 18px; width: 520px; height: 76px; padding: 0 22px; border-radius: 14px; background: var(--card); border: 1px solid var(--strong); }
  .file .ico { width: 40px; height: 48px; border-radius: 6px; border: 2px solid var(--muted); position: relative; flex: none; }
  .file .ico::after { content: ""; position: absolute; right: -2px; top: -2px; width: 14px; height: 14px; background: var(--card); border-left: 2px solid var(--muted); border-bottom: 2px solid var(--muted); border-bottom-left-radius: 4px; }
  .file .ico b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 10px; font-weight: 700; color: var(--lime); letter-spacing: 0.04em; }
  .file .name { font-family: "Geist Mono", monospace; font-size: 20px; color: var(--text-strong); }
  .file .kind { margin-left: auto; font-size: 18px; color: var(--muted); }
  .cursor { position: absolute; width: 34px; height: 44px; z-index: 20; }
  .click { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 3px solid var(--lime); z-index: 19; }

  /* record screen (the native recorder, drawn) */
  .rec { position: absolute; inset: 0; padding: 70px 26px 26px; display: flex; flex-direction: column; gap: 16px; font-family: "Geist", sans-serif; }
  .rec .bar { display: flex; justify-content: space-between; align-items: center; color: var(--text-strong); font-size: 17px; font-weight: 600; }
  .rec .tecard { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: 18px 18px 20px; }
  .rec .eb { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .rec .hero { font-family: "Geist Mono", monospace; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .rec .stats { display: flex; gap: 12px; }
  .rec .stats div { display: flex; flex-direction: column; gap: 3px; }
  .rec .stats .v { font-family: "Geist Mono", monospace; font-size: 17px; color: var(--text-body); font-variant-numeric: tabular-nums; }
  .rec .stop { height: 54px; border-radius: 14px; background: rgba(242,114,107,0.14); border: 1px solid rgba(242,114,107,0.5); color: var(--danger); font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  /* chat */
  .chat { position: absolute; border-radius: 22px; background: var(--card); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 40px 110px rgba(0,0,0,0.6); overflow: hidden; }
  .chat .head { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 26px; border-bottom: 1px solid var(--hair); color: var(--text-strong); font-size: 19px; font-weight: 600; }
  .chat .head .conn { margin-left: auto; font-size: 15px; font-weight: 500; color: var(--lime); display: flex; align-items: center; gap: 8px; }
  .chat .body { padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; }
  .bubble { max-width: 78%; padding: 18px 22px; border-radius: 20px; font-size: 22px; line-height: 1.45; }
  .bubble.user { align-self: flex-end; background: var(--lime-tint); border: 1px solid rgba(200,242,78,0.35); color: var(--text-strong); border-bottom-right-radius: 6px; }
  .bubble.bot { align-self: flex-start; background: var(--raised); border: 1px solid var(--hair); color: var(--text-body); border-bottom-left-radius: 6px; max-width: 92%; white-space: pre-wrap; }
  .bubble.bot b { color: var(--text-strong); font-weight: 600; }
  .toolchip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 10px; background: #0f0f12; border: 1px solid var(--hair); font-family: "Geist Mono", monospace; font-size: 15px; color: var(--muted); margin-right: 10px; }
  .toolchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }

  /* cta */
  .store { display: inline-flex; align-items: center; height: 76px; padding: 0 34px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.28); color: var(--text-strong); font-size: 25px; font-weight: 600; gap: 12px; }
  .store small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
  .platforms { display: flex; gap: 14px; }
  .platforms span { height: 52px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--strong); background: var(--card); color: var(--text-strong); font-size: 22px; font-weight: 600; display: inline-flex; align-items: center; }

  #flash { position: absolute; inset: 0; background: var(--lime); opacity: 0; pointer-events: none; z-index: 40; }
  #wipe { position: absolute; top: -200px; left: 0; width: 2600px; height: 1480px; z-index: 50; pointer-events: none; }
  #wipe .panel { position: absolute; inset: 0; background: var(--bg); transform: skewX(-18deg); }
  #wipe .edge { position: absolute; top: 0; bottom: 0; width: 44px; background: var(--lime); transform: skewX(-18deg); }
  #wipe .edge.lead { right: -60px; }
  #wipe .edge.trail { left: -30px; width: 12px; opacity: 0.8; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 60; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg-base" style="background: var(--bg)"></div>
  <div class="bg" id="bg-glow"></div>
  <div class="bg" id="bg-grid"></div>
  <div class="bg" id="bg-vignette"></div>
  <div id="scenes"></div>
  <div id="flash"></div>
  <div id="wipe"><div class="panel"></div><div class="edge trail"></div><div class="edge lead"></div></div>
  <div id="fade"></div>
</div>
<script type="module" src="./promo.js"></script>
</body>
</html>
