# iOS client CI (spec: docs/specs/native/NS-10-native-ci.md).
#
# macOS runners bill at a heavy multiplier, so this is kept off web/backend PRs by
# the path filter and superseded runs are cancelled. It triggers on contracts/**
# too: a golden change has to be proven against the Swift decoders in the same PR
# that makes it.
name: iOS

on:
  push:
    branches: [main]
    paths: ["apps/ios/**", "contracts/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", "contracts/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The Kit builds for macOS as well as iOS precisely so its tests need no
      # simulator: `swift test` runs the whole suite in seconds, where
      # `xcodebuild test` would boot one first for the same result.
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: apps/ios/Packages/TrackEvolutionKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Packages/TrackEvolutionKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Kit tests (no simulator)
        working-directory: apps/ios/Packages/TrackEvolutionKit
        run: swift test

      # Apple has granted com.apple.developer.carplay-driving-task, so the key is now
      # checked in (NS-19) and this guard runs the other way: dropping it would
      # silently ship a build whose CarPlay scene never attaches, which no test
      # catches because the phone app is unaffected.
      #
      # The file is also linted. An entitlements file that doesn't parse is the
      # failure mode that actually happened here — a hand-edited `<key>` with no
      # value left the retired Capacitor app's Release entitlements invalid, and
      # nothing noticed.
      - name: The CarPlay entitlement stays in, and the entitlements parse
        run: |
          for f in apps/ios/App/TrackEvolution.entitlements; do
            if ! plutil -lint "$f"; then
              echo "::error::$f is not a valid plist"
              exit 1
            fi
          done
          # Checked against the *parsed* plist, not the raw file: the entitlements
          # carry explanatory comments, and a plain grep would match that prose.
          if ! plutil -convert json -o - apps/ios/App/TrackEvolution.entitlements \
            | grep -q "carplay-driving-task"; then
            echo "::error::com.apple.developer.carplay-driving-task is missing — CarPlay ships inert without it (NS-19)"
            exit 1
          fi

      # Unsigned simulator build: no signing secret is a prerequisite for green.
      - name: Build the app
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project TrackEvolution.xcodeproj \
            -scheme TrackEvolution \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
