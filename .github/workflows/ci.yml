name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The API contract the native clients decode (contracts/golden/). A
      # response-shape change that doesn't regenerate these fails here, with a
      # readable diff, instead of silently breaking the iOS/Android decoders.
      - run: npm run contracts:check
