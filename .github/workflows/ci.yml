name: CI

# Web and backend. Deliberately `paths-ignore` rather than `paths`: a new
# top-level directory then still runs this by default, where an allowlist would
# silently skip it. Native-only changes are covered by ios.yml / android.yml, and
# note contracts/** is NOT ignored — a golden change must run the API tests too.
on:
  push:
    branches: [main]
    paths-ignore: ["apps/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["apps/**", "docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The API contract the native clients decode (contracts/golden/). A
      # response-shape change that doesn't regenerate these fails here, with a
      # readable diff, instead of silently breaking the iOS/Android decoders.
      - run: npm run contracts:check
