# Android client CI (spec: docs/specs/native/NS-10-native-ci.md).
#
# :core is pure Kotlin/JVM by design, so this needs no Android SDK and no emulator
# — which is what keeps it under a minute. Emulator tests are deliberately not part
# of a PR run; if instrumentation tests ever appear, gate them to a nightly.
name: Android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "contracts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "contracts/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # :app isn't in settings.gradle.kts yet (NS-02 landed :core only), and its
      # absence is what lets this run without an SDK install. Add
      # `:app:assembleDebug` here in the same change that adds the module.
      - name: Core tests
        working-directory: apps/android
        run: ./gradlew :core:test --no-daemon
