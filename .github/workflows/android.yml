# Android client CI (spec: docs/specs/native/NS-10-native-ci.md).
#
# :core is pure Kotlin/JVM by design, so this needs no Android SDK and no emulator
# — which is what keeps it under a minute. :app's tests are Robolectric, so they
# need the SDK but still no emulator. Instrumentation tests are deliberately not
# part of a PR run; if any ever appear, gate them to a nightly.
name: Android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "contracts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "contracts/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Deliberately no SDK install. :app is in the build now, but AGP defers its
      # SDK check to task execution, so configuring it costs nothing here and
      # this job stays under a minute. The app job below is what needs the SDK.
      - name: Core tests
        working-directory: apps/android
        run: ./gradlew :core:test --no-daemon

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 21 rather than the core job's 17: :app depends on :core, whose toolchain
      # is 21, so running on 21 means Gradle never has to go hunting for a
      # second JDK. AGP itself is happy on anything 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # Compiles the Compose UI and dexes :core — which is the real assertion
      # here, that the pure-JVM module is consumable from the Android shell.
      # No emulator: instrumentation tests, if they ever appear, go nightly.
      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon

      # Robolectric, so still no emulator. This is what proves the offline queue
      # survives on real SQLite rather than only in the in-memory fake :core
      # tests against — and the queue holds recorded sessions that exist nowhere
      # else until they replay, so "it probably persists" is not good enough.
      - name: App unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # The release variant runs R8 (Play scores obfuscation and shrinking, and
      # flags an unminified app), and R8 is where a debug build's success stops
      # meaning anything: a class it can't resolve, or a library that needs a
      # keep rule the debug variant never exercised, fails *this* build and no
      # other. Without this step that failure would first surface in the deploy
      # workflow, after the merge. Unsigned here — no keystore in the
      # environment — which is exactly what build.gradle.kts does on a laptop.
      - name: Assemble the minified release bundle
        working-directory: apps/android
        run: ./gradlew :app:bundleRelease --no-daemon
