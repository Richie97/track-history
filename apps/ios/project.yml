# XcodeGen source of truth for apps/ios/TrackEvolution.xcodeproj.
#
# The generated .xcodeproj IS committed, so a clean checkout builds with nothing
# but Xcode installed (and Xcode Cloud / CI needs no extra tooling). Regenerate
# with `xcodegen generate` from this directory after editing this file — never
# hand-edit the project in Xcode's inspector, the change would be lost on the
# next generate.
name: TrackEvolution

options:
  bundleIdPrefix: app.trackevolution
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
  groupSortPosition: top

# Shown in the navigator without being compiled into anything: the StoreKit
# configuration the TrackEvolution scheme runs against (see `schemes` below).
fileGroups:
  - Configuration.storekit

packages:
  # Pure logic (models, API client, recorder core, lap geometry). Local path
  # package so `swift test` can run the suite without booting a simulator.
  TrackEvolutionKit:
    path: Packages/TrackEvolutionKit

settings:
  base:
    # Swift 6 language mode with complete concurrency checking. The recorder is
    # inherently concurrent (background location callbacks + UI); enforcing this
    # from the scaffold up is far cheaper than retrofitting it later.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: L3NS86NMXZ
    MARKETING_VERSION: "1.7"
    # Local builds only. Xcode Cloud replaces CFBundleVersion with its own build
    # number for every archive (README → App version), which is also why the
    # paid-app grandfather cutoff — Entitlement.APPLE_FIRST_SUBSCRIPTION_BUILD in
    # the Kit, APPLE_FIRST_SUBSCRIPTION_BUILD on the Worker — is nil until phase D
    # has archived the first free build and can read its number off Xcode Cloud.
    CURRENT_PROJECT_VERSION: "1"

targets:
  TrackEvolution:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TrackEvolutionKit
        product: TrackEvolutionKit
    settings:
      base:
        # Identical to the Capacitor app's id, deliberately: it makes the native
        # build an in-place App Store update that keeps ratings, install base
        # and the Universal Links association. Do not change.
        PRODUCT_BUNDLE_IDENTIFIER: app.trackevolution
        PRODUCT_NAME: TrackEvolution
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/TrackEvolution.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  # Logic that belongs to the *app* rather than to the Kit, and so cannot be
  # reached by `swift test` (NS-34).
  #
  # Almost everything testable lives in the Kit precisely so it needs no
  # simulator, and that stays the rule: this target exists for the handful of
  # values that are facts about a window rather than about the domain — the
  # layout breakpoints — which the spec keeps out of the Kit and pins with a test
  # on each platform instead. Adding a case here should feel like a decision.
  TrackEvolutionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TrackEvolution
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trackevolution.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TrackEvolution.app/TrackEvolution"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  # Taps through the real sign-in browser flow, which is the one part of NS-08 no
  # unit test can reach. Skipped unless TE_DEV_SERVER is set, because it needs
  # `npm run dev` on :8787 — see UITests/SignInUITests.swift.
  TrackEvolutionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TrackEvolution
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trackevolution.uitests
        TEST_TARGET_NAME: TrackEvolution
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TrackEvolution:
    build:
      targets:
        TrackEvolution: all
        TrackEvolutionTests: [test]
        TrackEvolutionUITests: [test]
    run:
      config: Debug
      # Local purchases against the two synthetic products (NS-32), no App Store
      # Connect and no sandbox account needed. Xcode's local store signs the
      # transactions, so the Worker rejects them with 400 by design — the sandbox
      # is where the server round trip is tested. See apps/ios/README.md.
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
      targets:
        - TrackEvolutionTests
        - TrackEvolutionUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
