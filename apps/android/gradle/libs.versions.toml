# Version catalog for the Android client.
# Keep additions here rather than inline in build files, so :core and (later)
# :app can never drift onto different versions of the same library.

[versions]
kotlin = "2.0.21"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
# The HTTP client. Ktor rather than Retrofit/OkHttp directly because :core is a
# plain JVM module: the engine is injected, so the same client code runs under
# MockEngine in a JVM test and OkHttp on the device.
ktor = "3.0.3"
junit = "5.11.3"
# The Compose compiler ships as a Kotlin plugin from Kotlin 2.0 on, so it has no
# version of its own — it tracks `kotlin` above. Keep them moving together.
agp = "8.7.3"
androidxCore = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
# Not used directly — the app is ComponentActivity, not FragmentActivity — but
# play-services-location drags in fragment 1.0.0, and the ActivityResult APIs
# need 1.3.0+ or lintVital fails the release build. Pinned forward rather than
# suppressed, because the lint is right: old FragmentActivity really did break
# those APIs.
fragment = "1.8.5"
composeBom = "2024.12.01"
coreSplashscreen = "1.0.1"
# Fused location. The recorder needs dense, high-accuracy fixes; see NS-16.
playServicesLocation = "21.3.0"
datastore = "1.1.1"
# Chrome Custom Tabs. Sign-in must happen in the system browser — Google blocks
# OAuth in an embedded WebView — and this is the tab that shares its cookies.
browser = "1.8.0"
securityCrypto = "1.1.0-alpha06"
# Navigation (NS-26). 2.8+ is what makes routes type-safe @Serializable objects
# rather than string templates you can typo.
navigation = "2.8.5"
# The offline cache and write queue (NS-22). Room rather than raw SQLite for the
# suspend-aware `withTransaction`, which is what lets a queued write and its
# optimistic cache patch commit together.
room = "2.6.1"
# KSP replaces kapt for Room's annotation processing. The version is a pair —
# the suffix tracks the Kotlin version, so bumping `kotlin` above means bumping
# this too or the plugin refuses to load.
ksp = "2.0.21-1.0.28"
# Replay scheduling. A CoroutineWorker with a CONNECTED constraint survives
# process death, which a coroutine in a ViewModel does not.
work = "2.10.0"
# :app's JVM tests. Robolectric runs both Room against real SQLite and Compose
# itself without an emulator — so CI proves the queue survives a restart (NS-22)
# and the charts render their degenerate datasets (NS-24), on the same runner.
junit4 = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# ktor-client-core carries no engine; :core stays engine-agnostic and :app picks
# OkHttp, while tests drive the same code through MockEngine.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# Backs the persisted theme override (NS-07) and, later, any other small setting.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Scopes a screen's model to its NavBackStackEntry (NS-26), so rotation and a
# theme change don't re-fetch the screen or drop a half-typed form.
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# `createSavedStateHandle()`, which is what carries an event-form draft through
# the system killing the app in the background.
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
# The bearer token at rest. Must stay readable while the device is locked — the
# lap recorder runs locked and has to sync.
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
# room-ktx carries the suspend `withTransaction` the OfflinePersistence contract
# is built around; room-runtime alone cannot express it.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# Drives the chart composables under Robolectric, so the degenerate datasets
# and the TalkBack strings are gated by CI rather than by remembering to look.
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
