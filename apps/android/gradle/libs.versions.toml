# Version catalog for the Android client.
# Keep additions here rather than inline in build files, so :core and (later)
# :app can never drift onto different versions of the same library.

[versions]
kotlin = "2.0.21"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
# The HTTP client. Ktor rather than Retrofit/OkHttp directly because :core is a
# plain JVM module: the engine is injected, so the same client code runs under
# MockEngine in a JVM test and OkHttp on the device.
ktor = "3.0.3"
junit = "5.11.3"
# The Compose compiler ships as a Kotlin plugin from Kotlin 2.0 on, so it has no
# version of its own — it tracks `kotlin` above. Keep them moving together.
agp = "8.7.3"
androidxCore = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
coreSplashscreen = "1.0.1"
# Fused location. The recorder needs dense, high-accuracy fixes; see NS-16.
playServicesLocation = "21.3.0"
datastore = "1.1.1"
# Chrome Custom Tabs. Sign-in must happen in the system browser — Google blocks
# OAuth in an embedded WebView — and this is the tab that shares its cookies.
browser = "1.8.0"
securityCrypto = "1.1.0-alpha06"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# ktor-client-core carries no engine; :core stays engine-agnostic and :app picks
# OkHttp, while tests drive the same code through MockEngine.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# Backs the persisted theme override (NS-07) and, later, any other small setting.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
# The bearer token at rest. Must stay readable while the device is locked — the
# lap recorder runs locked and has to sync.
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
