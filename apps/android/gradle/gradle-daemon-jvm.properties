# Pins the Gradle daemon to a Java 21 toolchain regardless of the JVM that
# launched `./gradlew` — so a machine whose default `java` is newer than Gradle
# supports (e.g. a Homebrew JDK) still builds. Deliberately no toolchainVendor:
# Android Studio generated this with JETBRAINS, which would have forced CI to
# download the JetBrains Runtime instead of matching the runner's preinstalled
# Temurin 21. The URLs below are only the fallback for machines with no local
# 21 at all (they point at JBR builds, which is fine for that purpose).
toolchainUrl.FREE_BSD.AARCH64=https\://api.foojay.io/disco/v3.0/ids/491f83666ae7f4d6ebb28fee72ebb035/redirect
